[package]
name         = "genshin_pinyin_add"
version      = "1.0.4"
edition      = "2024"
rust-version = "1.85"

[profile.release]
strip = true
lto   = true
panic = "abort"

[dependencies]
pinyin = { version = "0.11.0", default-features = false, features = ["heteronym", "plain"] }
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all      = "warn"
pedantic = "warn"
