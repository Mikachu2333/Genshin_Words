[package]
name = "genshin_pinyin_add"
version = "1.0.5"
edition = "2024"
rust-version = "1.85"

[profile.release]
strip = true
lto = true
panic = "abort"

[dependencies]
pinyin = { version = "0.11.0", default-features = false, features = [
    "plain",
] }
tempfile = "3.27.0"
sort_lib = { path = "../genshin_pinyin_sort/sort_lib" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
