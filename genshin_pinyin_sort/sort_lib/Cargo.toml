[package]
name = "sort_lib"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"

[lib]
name = "sort_lib"
path = "mod.rs"

[dependencies]
pinyin = { version = "0.11.0", default-features = false, features = [
    "plain",
] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
